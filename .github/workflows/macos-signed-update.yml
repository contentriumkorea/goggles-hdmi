name: Publish verified Apple Silicon update
on:
  push:
    branches: [main]
    paths: ['channels/macos-arm64.json']
permissions:
  contents: write
jobs:
  signed-update:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --only-binary=:all: cryptography==50.0.1
      - name: Verify publisher signature and download existing prerelease pkg
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, shutil, subprocess, zipfile
          from pathlib import Path
          from cryptography.hazmat.primitives.asymmetric.ed25519 import Ed25519PublicKey
          configuration = json.loads(Path('release_config_macos.json').read_text())
          manifest = Path('channels/macos-arm64.json').read_bytes()
          assert len(manifest) < 65536
          envelope = json.loads(manifest); release = envelope['release']
          canonical = json.dumps(release,sort_keys=True,separators=(',',':'),ensure_ascii=True).encode()
          Ed25519PublicKey.from_public_bytes(bytes.fromhex(configuration['update_public_key'])).verify(
              base64.b64decode(envelope['signature'],validate=True),canonical)
          expected = dict(product=configuration['product'],version=configuration['version'],platform='darwin',
              architecture='arm64',channel='macos-preview',installer_kind='pkg',installer_name='setup.pkg')
          assert all(release.get(key) == value for key,value in expected.items())
          version = release['version']; tag = f'macos-arm64-v{version}-preview'
          name = f'Goggles-HDMI-macOS-arm64-{version}-preview.pkg'
          assert release['url'] == f'https://github.com/{configuration["github_repository"]}/releases/download/{tag}/{name}'
          metadata = json.loads(subprocess.check_output(['gh','release','view',tag,'--json','isPrerelease,isDraft'],text=True))
          assert metadata['isPrerelease'] and not metadata['isDraft']
          output = Path('signed-macos-update'); output.mkdir()
          subprocess.run(['gh','release','download',tag,'--pattern',name,'--dir',str(output)],check=True)
          package = output/name
          with package.open('rb') as stream:
              assert stream.read(4) == b'xar!'; stream.seek(0)
              assert hashlib.file_digest(stream,'sha256').hexdigest() == release['sha256']
          assert package.stat().st_size == release['size'] and 0 < release['size'] <= 1024**3
          (output/'release-macos-arm64.json').write_bytes(manifest)
          bundle = output/f'Goggles-HDMI-macOS-arm64-{version}-preview.ghupdate'
          with zipfile.ZipFile(bundle,'w',compression=zipfile.ZIP_STORED) as archive:
              archive.writestr(zipfile.ZipInfo('release.json',(1980,1,1,0,0,0)),manifest)
              with archive.open(zipfile.ZipInfo('setup.pkg',(1980,1,1,0,0,0)),'w') as target, package.open('rb') as source:
                  shutil.copyfileobj(source,target,16*1024*1024)
          with bundle.open('rb') as stream: digest = hashlib.file_digest(stream,'sha256').hexdigest()
          (output/'SHA256SUMS-macos-arm64.txt').write_text(f'{release["sha256"]}  {name}\n{digest}  {bundle.name}\n')
          subprocess.run(['gh','release','upload',tag,str(output/'release-macos-arm64.json'),str(bundle),
              str(output/'SHA256SUMS-macos-arm64.txt')],check=True)
          subprocess.run(['gh','release','edit',tag,'--notes-file','docs/macos-release-notes.md'],check=True)
          print('Published verified signed Mac update; Windows latest release was not changed.')
          PY
